name: Gated issue_comment command

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  permission-gate:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Require write permission for the commenter
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(data.permission);
            core.setOutput('allowed', String(allowed));
            if (!allowed) core.setFailed('write permission is required');

  command:
    needs: [permission-gate]
    if: github.event.issue.pull_request != null && needs.permission-gate.outputs.allowed == 'true'
    uses: dinkuskit/commerce/.github/workflows/command.yml@0123456789abcdef0123456789abcdef01234567
    permissions:
      contents: read
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
